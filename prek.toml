minimum_prek_version = "0.3.11"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  { id = "nix-fmt", name = "Format Nix files", language = "system", entry = "nix fmt", files = "\\.nix$" },
  { id = "gitleaks", name = "Detect hardcoded secrets", language = "system", entry = "gitleaks git --pre-commit --redact --staged --verbose", pass_filenames = false },
]
